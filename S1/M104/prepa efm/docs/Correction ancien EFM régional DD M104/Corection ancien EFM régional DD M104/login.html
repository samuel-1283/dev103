<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form action="">
                    <h1 class="text-center">Connexion</h1>
                    <label for="log">Login </label>
                    <input class="form-control" type="text" name="" id="log" placeholder="Saisir votre login">
                    <br>
                    <label for="pwd">Mot de passe </label>
                    <input class="form-control" type="text" name="" id="pwd" placeholder="Saisie votre pwd">
                    <br>
                    <label for="conx">Rester conecté</label>
                    <input type="checkbox" checked name="" id="conx">
                    <br>
                    <button type="button" class="btn btn-outline-info w-100">Se connecter</button>
                </form>
            </div>
        </div>
    </div>
   


    <script src="js/bootstrap.min.js"></script>
</body>
</html>
