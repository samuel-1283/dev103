<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      
        .logo{
            border-radius: 50%;
            width: 200px;
            height: 200px;
        }
        .ani{
            animation-iteration-count: infinite;
            animation-duration:1s;
            animation-name:rot;
        }
        
            
        @keyframes rot {
                to{
                    transform:rotate(360deg);
                }
            }
        .dir{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
   <div class="dir">
        <h1>Morocco Flag</h1>
        <div class="ani"> <img src="téléchargement.jpg" class="logo" alt=""></div>
    </div>
</body>
</html>
