<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            overflow: hidden;
            border: 1px solid #000;
        }
        .block2{
            float: right;
            background: #3498db;
            height: 40px;
            color: #fff;
            border: 1px solid #000;
            margin: 5px;
        }
        .block3{
            float: right;
            clear: right;
            background: #d35400;
            margin: 5px;
            margin-bottom: 5px;
            height: 40px;
            color: #fff;
            border: 1px solid #000;
        }
        .block4{
            clear: both;
            background: #1abc9c;
            height: 40px;
            color: #fff;
            text-align: center;
            margin: 5px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="block2">block2</div>
        <div class="block3">block3</div>
        <div class="block4">block4</div>
    </div>
</body>
</html>
