<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            overflow: hidden;
            border: 1px solid #000;
        }
        div{
            border: 1px solid rgba(0, 0, 0, 1);
            text-align: center;
            color: #fff;
            overflow: hidden;
        }
        .box{
            float: left;
            background: #3498db;
            margin: 5px;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">block2</div>
        <div class="box">block3</div>
        <div class="box">block4</div>
    </div>
</body>
</html>
