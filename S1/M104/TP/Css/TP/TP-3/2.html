<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            overflow: hidden;
        }
        .block2{
            float: left;
            background: #3498db;
            height: 40px;
            color: #fff;
            border: 1px solid #000;
        }
        .block3{
            background: #d35400;
            height: 60px;
            color: #fff;
            text-align: center;
            border: 1px solid #000;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="block2">block2</div>
        <div class="block3">block3</div>
    </div>
</body>
</html>
