<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaires avec Bootstrap</title>
    <!-- <link rel="stylesheet" href="css/bootstrap.min.css"> -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <!--  form-label, form-control, form-control-sm/lg
        form-check, form-check-input, form-check-label, form-switch
        form-select, form-select-sm/lg
        btn, btn-primary, btn-secondary, btn-success, btn-danger, btn-warning, btn-info, btn-dark, btn-light
        btn-outline-primary, btn-outline-secondary, btn-outline-success, btn-outline-danger, btn-outline-warning, btn-outline-info, btn-outline-dark, btn-outline-light
        form-text
        input-group-text, input-group 
        was-validated, valid-feedback, invalid-feedback
    -->
<div class="container">
    <div class="row mt-5">
        <div class="col">
            <h1>Contact</h1>
            <form action="#" class="was-validated">
                <div class="mb-3">
                    <label class="form-label" for="mail">E-mail: </label>
                    <div class="input-group">
                        <input class="form-control" type="email" placeholder="example@gmail.com" name="" id="mail">
                        <span class="input-group-text">@</span>
                    </div>
                    
                    <div class="form-text">Votre email sera enregistré d'une manière sécurisé</div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="comment">Comment: </label>
                    <textarea class="form-control" name="" id="comment" cols="30" rows="10" required></textarea>
                    <div class="valid-feedback">Validé</div>
                    <div class="invalid-feedback">Non Validé</div>
                </div>
                <div class="form-check form-switch mb-3">
                    <label class="form-check-label" for="check">Subscribe to the newsletter </label>
                    <input class="form-check-input" type="checkbox" name="" id="check">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="country">Country: </label>
                    <select name="" id="country" class="form-select">
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="dlist">List: </label>
                    <input  class="form-select" list="li" id="dlist" >
                    <datalist id="li" >
                        <option value="11">11</option>
                        <option value="22">22</option>
                        <option value="33">33</option>
                    </datalist>
                </div>
                <button type="button" class="btn btn-success">Send</button>
                <button type="button" class="btn btn-outline-success">Send</button>
            </form>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- <script src="js/bootstrap.bundle.min.js"></script> -->
</body>
</html>
